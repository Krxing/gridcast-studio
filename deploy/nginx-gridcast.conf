# GridCast Studio Nginx HTTPS 反向代理示例
# 安装：cp deploy/nginx-gridcast.conf /etc/nginx/sites-available/gridcast.conf
#       ln -s /etc/nginx/sites-available/gridcast.conf /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
# 证书路径按实际替换（示例为 certbot 默认位置）。

server {
    listen 80;
    server_name gridcast.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gridcast.example.com;

    ssl_certificate     /etc/letsencrypt/live/gridcast.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gridcast.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 后端 CSV 上传上限 20 MB，此处留出余量
    client_max_body_size 25m;

    # 登录 Cookie 有效 8 小时，略大于其寿命即可
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
